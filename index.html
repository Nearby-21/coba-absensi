<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAPH - Sistem Absensi & Manajemen Pengikut</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Html5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { 
            background-image: url('https://lh3.googleusercontent.com/d/1nGMk9tfcLQ3y59mm3i0_b-hvB_y6Brv_'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0; 
            padding: 0; 
            background-color: #0f172a;
        }
        .bg-overlay {
            background-color: rgba(15, 23, 42, 0.45);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="w-full min-h-screen text-slate-100 font-sans antialiased flex flex-col items-center justify-start m-0 p-0 select-none">

    <!-- Mobile Container -->
    <div class="w-full max-w-md min-h-screen bg-overlay backdrop-blur-[2px] flex flex-col relative pb-12 shadow-2xl border-x border-white/10">

        <!-- Top Header Mobile -->
        <header class="w-full bg-slate-900/70 backdrop-blur-md text-white px-4 pt-5 pb-5 rounded-b-[2rem] shadow-lg shrink-0 border-b border-white/10">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-md shadow-inner ring-1 ring-white/30">
                        <i class="fa-solid fa-skull text-lg text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold tracking-tight leading-none text-white">BAPH</h1>
                        <p class="text-[10px] text-indigo-200 font-medium mt-1">Sistem Absensi & Manajemen Pengikut</p>
                    </div>
                </div>
                <span class="bg-emerald-500/25 border border-emerald-400/40 text-emerald-300 text-[10px] px-2.5 py-1 rounded-full font-semibold flex items-center gap-1.5 backdrop-blur-md">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> GitHub API
                </span>
            </div>

            <!-- Date & Status Bar -->
            <div class="flex justify-between items-center bg-white/10 backdrop-blur-md rounded-2xl px-3.5 py-2 border border-white/15 text-xs font-medium text-indigo-50 shadow-inner">
                <div class="flex items-center gap-2">
                    <i class="fa-regular fa-calendar text-indigo-200"></i>
                    <span id="currentDate">-</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-database text-indigo-200 text-[10px]"></i>
                    <span>Sheets Connected</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="w-full flex-grow px-4 py-4 space-y-4">
            
            <!-- Alert Notification -->
            <div id="alertBox" class="hidden p-3 rounded-2xl text-xs font-medium transition-all shadow-sm"></div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div onclick="openTingkatanModal()" class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition cursor-pointer flex flex-col justify-between group">
                    <div class="flex justify-between items-center">
                        <div class="text-slate-300 text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-users text-indigo-400 text-xs"></i> Total Pengikut
                        </div>
                        <i class="fa-solid fa-chevron-right text-[11px] text-slate-400 group-hover:translate-x-0.5 transition"></i>
                    </div>
                    <div id="totalSantriCount" class="text-2xl font-black text-white mt-2">0</div>
                    <div class="text-[9px] text-indigo-300 mt-1 font-medium">Pemula &bull; Menengah &bull; Penyembah</div>
                </div>

                <div class="flex flex-col gap-2">
                    <div onclick="openMasukTodayModal()" class="bg-slate-900/80 backdrop-blur-md p-3 rounded-2xl shadow-md border border-white/15 hover:border-emerald-400/50 hover:bg-slate-900/90 transition cursor-pointer flex flex-col justify-between group">
                        <div class="flex justify-between items-center">
                            <div class="text-slate-300 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">
                                <i class="fa-solid fa-user-check text-emerald-400 text-[10px]"></i> Hadir
                            </div>
                            <i class="fa-solid fa-chevron-right text-[9px] text-slate-400"></i>
                        </div>
                        <div id="hadirCount" class="text-lg font-black text-emerald-400 mt-1">0</div>
                    </div>

                    <div onclick="openTidakHadirModal()" class="bg-slate-900/80 backdrop-blur-md p-3 rounded-2xl shadow-md border border-white/15 hover:border-rose-400/50 hover:bg-slate-900/90 transition cursor-pointer flex flex-col justify-between group">
                        <div class="flex justify-between items-center">
                            <div class="text-slate-300 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1">
                                <i class="fa-solid fa-user-xmark text-rose-400 text-[10px]"></i> Tidak Hadir
                            </div>
                            <i class="fa-solid fa-chevron-right text-[9px] text-slate-400"></i>
                        </div>
                        <div id="tidakHadirCount" class="text-lg font-black text-rose-400 mt-1">0</div>
                    </div>
                </div>
            </div>

            <!-- Menu Navigasi Modern -->
            <div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider text-indigo-200 mb-2.5 px-1 drop-shadow">Menu Navigasi</h3>
                <div class="grid grid-cols-2 gap-3">
                    
                    <button onclick="openScanModal()" class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition text-left flex flex-col justify-between group">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-sm group-hover:scale-110 transition shadow-xs border border-indigo-400/30">
                            <i class="fa-solid fa-qrcode"></i>
                        </div>
                        <div class="mt-3">
                            <h4 class="font-bold text-xs text-white leading-tight">Scan QR / Absen</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5">Kamera atau NIS</p>
                        </div>
                    </button>

                    <button onclick="openManualAbsenModal()" class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition text-left flex flex-col justify-between group">
                        <div class="w-10 h-10 rounded-xl bg-blue-500/20 text-blue-300 flex items-center justify-center text-sm group-hover:scale-110 transition shadow-xs border border-blue-400/30">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <div class="mt-3">
                            <h4 class="font-bold text-xs text-white leading-tight">Absen Manual</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5">Sakit, Izin, Alpa</p>
                        </div>
                    </button>

                    <button onclick="openRekapModal()" class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition text-left flex flex-col justify-between group">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-300 flex items-center justify-center text-sm group-hover:scale-110 transition shadow-xs border border-emerald-400/30">
                            <i class="fa-solid fa-clipboard-user"></i>
                        </div>
                        <div class="mt-3">
                            <h4 class="font-bold text-xs text-white leading-tight">Rekap Absen</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5">Kelola & Riwayat</p>
                        </div>
                    </button>

                    <button onclick="openAddStudentModal()" class="bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition text-left flex flex-col justify-between group">
                        <div class="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-sm group-hover:scale-110 transition shadow-xs border border-amber-400/30">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>
                        <div class="mt-3">
                            <h4 class="font-bold text-xs text-white leading-tight">Tambah Pengikut</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5">Daftar baru</p>
                        </div>
                    </button>

                </div>

                <button onclick="openDataModal()" class="w-full mt-3 bg-slate-900/80 backdrop-blur-md p-4 rounded-2xl shadow-md border border-white/15 hover:border-indigo-400/50 hover:bg-slate-900/90 transition flex items-center justify-between group">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-xl bg-violet-500/20 text-violet-300 flex items-center justify-center text-sm group-hover:scale-110 transition shadow-xs border border-violet-400/30">
                            <i class="fa-solid fa-database"></i>
                        </div>
                        <div class="text-left">
                            <h4 class="font-bold text-xs text-white leading-tight">Data Pengikut & Rekap Total</h4>
                            <p class="text-[10px] text-slate-300 mt-0.5">Kelola database lengkap pengikut</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 text-xs pr-1 group-hover:translate-x-0.5 transition"></i>
                </button>
            </div>

            <!-- Pengikut Terbaru Section -->
            <div class="pt-1 pb-3">
                <div class="flex justify-between items-center mb-2 px-1">
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-indigo-200 drop-shadow">Pengikut Terbaru</h3>
                    <button onclick="openDataModal()" class="text-[11px] font-bold text-indigo-300 hover:underline">Lihat Semua &rarr;</button>
                </div>
                <div id="recentSantriList" class="space-y-2">
                    <div class="text-center py-6 bg-slate-900/80 backdrop-blur-md rounded-2xl border border-white/15 text-slate-300 text-xs shadow-sm">
                        Memuat data...
                    </div>
                </div>
            </div>

        </main>

        <!-- Fixed Bottom Action Bar -->
        <footer class="w-full px-4 mt-4">
            <button onclick="exportToExcel()" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white rounded-2xl text-xs font-bold shadow-lg shadow-emerald-900/30 transition flex items-center justify-center gap-2 border border-emerald-400/30">
                <i class="fa-solid fa-file-excel text-sm"></i> Download Excel Full Tabel
            </button>
        </footer>

    </div>

    <!-- MODAL CONTAINER -->
    <div id="appModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-slate-900 text-slate-100 rounded-3xl shadow-2xl w-full max-w-sm max-h-[85vh] flex flex-col overflow-hidden my-auto transform transition-all border border-white/20">
            <div class="bg-gradient-to-r from-indigo-900 to-violet-900 px-5 py-4 text-white flex justify-between items-center shrink-0 border-b border-white/10">
                <h3 id="modalTitle" class="font-bold text-xs tracking-wide">Judul Modal</h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white p-1 text-base transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalBody" class="p-4 overflow-y-auto flex-grow space-y-3 relative" style="overflow: visible !important;">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- JavaScript App Logic -->
    <script>
        // Masukkan URL Deployment Web App Google Apps Script Anda di sini:
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwugJCkGsSH2gYQdVEMSQzkVYGaJx06wsSMHKBTgDIfSkiM5aArtuiFm5Py7cEFjkW-/exec";

        let globalData = { totalSantri: 0, hadirHariIni: 0, tidakHadirHariIni: 0, students: [], absenHistory: [], hadirTodayList: [], tidakHadirTodayList: [] };
        let html5QrCode = null;

        window.onload = function() {
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', options);
            loadDashboard();
        };

        // Fungsi Helper untuk memanggil Backend Google Apps Script via fetch API
        async function callBackend(action, payload = {}) {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: action, ...payload })
                });
                const result = await response.json();
                return result;
            } catch (err) {
                throw new Error("Koneksi API gagal: " + err.message);
            }
        }

        async function loadDashboard() {
            try {
                const data = await callBackend('getDashboardData');
                renderDashboard(data);
            } catch (err) {
                showAlert(err.message, 'error');
            }
        }

        function renderDashboard(data) {
            globalData = data;
            document.getElementById('totalSantriCount').innerText = data.totalSantri;
            document.getElementById('hadirCount').innerText = data.hadirHariIni;
            document.getElementById('tidakHadirCount').innerText = data.tidakHadirHariIni;

            const recentContainer = document.getElementById('recentSantriList');
            if (data.students.length === 0) {
                recentContainer.innerHTML = `<div class="text-center py-6 bg-slate-900/80 rounded-2xl border border-white/15 text-slate-300 text-xs shadow-sm">Belum ada data pengikut</div>`;
                return;
            }

            let html = '';
            data.students.slice(0, 3).forEach((item, index) => {
                html += `
                    <div class="bg-slate-900/80 backdrop-blur-md p-3.5 rounded-2xl shadow-sm border border-white/15 flex justify-between items-center hover:bg-slate-900/90 transition">
                        <div class="flex items-center space-x-3">
                            <div class="bg-indigo-500/20 text-indigo-300 font-bold text-xs w-8 h-8 rounded-xl flex items-center justify-center shrink-0 shadow-xs border border-indigo-400/30">
                                ${index + 1}
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-xs text-white truncate">${escapeHtml(item.nama)}</h4>
                                <p class="text-[10px] text-slate-300 mt-0.5">NIS: ${escapeHtml(item.nis)}</p>
                            </div>
                        </div>
                        <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded-xl font-semibold shrink-0 border border-indigo-400/30">${escapeHtml(item.kelas)}</span>
                    </div>
                `;
            });
            recentContainer.innerHTML = html;
        }

        function openTingkatanModal() {
            document.getElementById('modalTitle').innerText = 'Rekap Pengikut Berdasarkan Tingkatan';
            
            let pemulaCount = 0;
            let menengahCount = 0;
            let penyembahCount = 0;
            let lainnyaCount = 0;

            globalData.students.forEach(s => {
                const k = String(s.kelas || '').toLowerCase();
                if (k.includes('pemula') || k.includes('ibtida')) {
                    pemulaCount++;
                } else if (k.includes('menengah') || k.includes('tsanawi')) {
                    menengahCount++;
                } else if (k.includes('penyembah') || k.includes('aaliy') || k.includes('aliyah') || k.includes('aali')) {
                    penyembahCount++;
                } else {
                    lainnyaCount++;
                }
            });

            let html = `
                <div class="space-y-3">
                    <div class="bg-indigo-950/40 p-3.5 rounded-2xl border border-indigo-800/60 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">
                                <i class="fa-solid fa-school"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-xs">Pemula</h4>
                                <p class="text-[10px] text-indigo-300">Tingkat Dasar</p>
                            </div>
                        </div>
                        <span class="text-sm font-black text-indigo-300 bg-indigo-900/60 px-3 py-1 rounded-xl border border-indigo-700/50">${pemulaCount} Pengikut</span>
                    </div>

                    <div class="bg-blue-950/40 p-3.5 rounded-2xl border border-blue-800/60 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-blue-600 text-white font-bold flex items-center justify-center text-xs">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-xs">Menengah</h4>
                                <p class="text-[10px] text-blue-300">Tingkat Menengah</p>
                            </div>
                        </div>
                        <span class="text-sm font-black text-blue-300 bg-blue-900/60 px-3 py-1 rounded-xl border border-blue-700/50">${menengahCount} Pengikut</span>
                    </div>

                    <div class="bg-violet-950/40 p-3.5 rounded-2xl border border-violet-800/60 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-violet-600 text-white font-bold flex items-center justify-center text-xs">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-xs">Penyembah</h4>
                                <p class="text-[10px] text-violet-300">Tingkat Lanjut</p>
                            </div>
                        </div>
                        <span class="text-sm font-black text-violet-300 bg-violet-900/60 px-3 py-1 rounded-xl border border-violet-700/50">${penyembahCount} Pengikut</span>
                    </div>

                    ${lainnyaCount > 0 ? `
                    <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-white text-xs">Lainnya / Belum dikategorikan</h4>
                        </div>
                        <span class="text-sm font-black text-slate-300 bg-slate-900 px-3 py-1 rounded-xl border border-slate-700">${lainnyaCount} Pengikut</span>
                    </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('modalBody').innerHTML = html;
            openModalElement();
        }

        function openTidakHadirModal() {
            document.getElementById('modalTitle').innerText = 'Daftar Pengikut Tidak Hadir (Sakit/Izin/Alpa)';
            let html = `<div class="space-y-2.5">`;
            if (globalData.tidakHadirTodayList.length === 0) {
                html += `<div class="text-center py-8 text-slate-400 text-xs">Belum ada input data tidak hadir (Sakit/Izin/Alpa) hari ini.</div>`;
            } else {
                globalData.tidakHadirTodayList.forEach((item) => {
                    let badgeColor = item.status === 'Sakit' ? 'bg-amber-950 text-amber-300 border-amber-800' : (item.status === 'Izin' ? 'bg-blue-950 text-blue-300 border-blue-800' : 'bg-rose-950 text-rose-300 border-rose-800');
                    html += `
                        <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700 flex justify-between items-center text-xs text-slate-200">
                            <div class="min-w-0 pr-2">
                                <span class="font-bold text-white block truncate">${escapeHtml(item.nama)}</span>
                                <span class="text-[10px] text-slate-400">NIS: ${escapeHtml(item.nis)} &bull; Kelas: ${escapeHtml(item.kelas)}</span>
                                <span class="text-[9px] text-indigo-300 font-semibold block mt-0.5"><i class="fa-regular fa-clock"></i> ${escapeHtml(item.waktu)} WIB</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="px-2 py-0.5 rounded-xl border font-bold text-[10px] ${badgeColor}">${item.status}</span>
                                <button onclick="editAbsenPrompt(${item.rowId}, '${escapeQuote(item.status)}')" class="w-7 h-7 bg-amber-950/60 text-amber-300 rounded-xl flex items-center justify-center font-semibold border border-amber-800/50"><i class="fa-solid fa-pen text-[10px]"></i></button>
                                <button onclick="deleteAbsenItem(${item.rowId})" class="w-7 h-7 bg-rose-950/60 text-rose-300 rounded-xl flex items-center justify-center font-semibold border border-rose-800/50"><i class="fa-solid fa-trash text-[10px]"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            document.getElementById('modalBody').innerHTML = html;
            openModalElement();
        }

        function filterAutocomplete(inputId, suggestionId, hiddenNisId, notifId = null) {
            const inputVal = document.getElementById(inputId).value;
            const query = String(inputVal || "").toLowerCase().trim();
            const suggestionsBox = document.getElementById(suggestionId);
            const hiddenNis = document.getElementById(hiddenNisId);

            hiddenNis.value = '';

            if (!query) {
                suggestionsBox.classList.add('hidden');
                suggestionsBox.innerHTML = '';
                if(notifId) document.getElementById(notifId).classList.add('hidden');
                return;
            }

            const filtered = globalData.students.filter(s => {
                const nama = String(s.nama || "").toLowerCase();
                const nis = String(s.nis || "").toLowerCase();
                return nama.includes(query) || nis.includes(query);
            });

            if (filtered.length === 0) {
                suggestionsBox.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Pengikut tidak ditemukan</div>`;
                suggestionsBox.classList.remove('hidden');
                if(notifId) {
                    const nBox = document.getElementById(notifId);
                    nBox.className = "p-3 rounded-2xl text-xs border bg-rose-900/50 border-rose-700 text-rose-200 font-medium flex items-center gap-2";
                    nBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i><span>NIS / Nama tidak terdaftar.</span>`;
                    nBox.classList.remove('hidden');
                }
                return;
            }

            const exactMatch = filtered.find(s => String(s.nis).toLowerCase() === query || String(s.nama).toLowerCase() === query);
            if (exactMatch) {
                hiddenNis.value = exactMatch.nis;
                if(notifId) showMatchNotification(notifId, exactMatch);
            } else if (filtered.length === 1) {
                hiddenNis.value = filtered[0].nis;
                if(notifId) showMatchNotification(notifId, filtered[0]);
            } else {
                if(notifId) document.getElementById(notifId).classList.add('hidden');
            }

            let html = '';
            filtered.forEach(item => {
                html += `
                    <div onclick="selectSantri('${inputId}', '${suggestionId}', '${hiddenNisId}', '${escapeQuote(item.nama)}', '${escapeQuote(item.nis)}', '${escapeQuote(item.kelas)}', '${notifId}')" 
                         class="p-3 hover:bg-slate-800 cursor-pointer border-b border-slate-800 last:border-none flex justify-between items-center text-xs bg-slate-900 text-slate-200">
                        <div>
                            <span class="font-bold text-white block">${escapeHtml(item.nama)}</span>
                            <span class="text-[10px] text-slate-400">NIS: ${escapeHtml(item.nis)} &bull; Kelas: ${escapeHtml(item.kelas)}</span>
                        </div>
                        <i class="fa-solid fa-check text-xs text-indigo-400"></i>
                    </div>
                `;
            });

        function initCameraScanner() {
            if (html5QrCode) {
                try { html5QrCode.stop(); } catch(e){}
            }
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 190, height: 190 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    handleQrScanResult(decodedText.trim());
                },
                () => {}
            ).catch(err => {
                console.warn("Kamera tidak aktif:", err);
                const readerBox = document.getElementById('reader');
                if (readerBox) {
                    readerBox.innerHTML = `
                        <div class="p-6 text-center text-slate-400 text-xs bg-slate-950">
                            <i class="fa-solid fa-camera-slash text-xl mb-1.5 text-rose-400"></i>
                            <p>Kamera tidak aktif. Gunakan input manual.</p>
                        </div>
                    `;
                }
            });
        }

        function handleQrScanResult(scannedText) {
            const found = globalData.students.find(s =>

                String(s.nama).trim().toLowerCase() === scannedText.toLowerCase()
            );

            const nBox = document.getElementById('scanNotification');
            if (found) {
                document.getElementById('selectedScanNis').value = found.nis;
                document.getElementById('inputSearchScan').value = `${found.nama} (NIS: ${found.nis})`;
                showMatchNotification('scanNotification', found);

                if (html5QrCode) {
                    try { html5QrCode.stop(); } catch(e){}
                }
            } else {
                nBox.className = "p-3 rounded-2xl text-xs border bg-rose-900/50 border-rose-700 text-rose-200 font-medium flex items-center gap-2";
                nBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400"></i><span>QR Code "${escapeHtml(scannedText)}" tidak terdaftar!</span>`;
                nBox.classList.remove('hidden');

        }

        function exportToExcel() {
            if (globalData.students.length === 0) {
                showAlert('Tidak ada data pengikut untuk di-download!', 'error');
                return;
            }
            let csvContent = "No,Nama,NIS,Kelas,No Whatsapp\n";
            globalData.students.forEach((item, index) => {
                let row = [
                    index + 1,
                    `"${item.nama.replace(/"/g, '""')}"`,
                    `"${item.nis.replace(/"/g, '""')}"`,
                    `"${item.kelas.replace(/"/g, '""')}"`,
                    `"${item.whatsapp.replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\n";
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BAPH_Database_Pengikut_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showAlert('File berhasil di-download!', 'success');
        }

        function openModalElement() {
            const m = document.getElementById('appModal');
            m.classList.remove('hidden');
            m.classList.add('flex');
        }
        function closeModal() {
            if (html5QrCode) {
                try { html5QrCode.stop(); } catch(e){}
                html5QrCode = null;
            }
            const m = document.getElementById('appModal');
            m.classList.remove('flex');
            m.classList.add('hidden');
        }
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `p-3 rounded-2xl text-xs font-medium transition-all shadow-sm ${type === 'success' ? 'bg-emerald-950/80 text-emerald-200 border border-emerald-800' : 'bg-rose-950/80 text-rose-200 border border-rose-800'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }
        function escapeHtml(text) {
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        function escapeQuote(text) {
            return text.toString().replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
