<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi & Data Santri</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Form Input Santri Baru</h1>
        
        <!-- Form Input -->
        <form id="formSantri" onsubmit="handleSaveStudent(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Santri</label>
                <input type="text" id="nama" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">NIS (Nomor Induk Siswa)</label>
                <input type="text" id="nis" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Kelas</label>
                <input type="text" id="kelas" required class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition">Simpan Data</button>
        </form>
    </div>

    <script>
        // Ganti dengan Web App URL dari Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx8syQhbeC1nYnAJQOgKCBPZja6Ip44EqjLCwUe4R-e8ta8UXDnpvVJxZATG2nEV-e7/exec";

        function handleSaveStudent(event) {
            event.preventDefault();

            const formData = {
                nama: document.getElementById('nama').value,
                nis: document.getElementById('nis').value,
                kelas: document.getElementById('kelas').value
            };

            // Kirim data menggunakan Fetch API (menggunakan mode no-cors untuk menghindari blokir browser)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert('Data santri berhasil dikirim ke Google Sheet!');
                document.getElementById('formSantri').reset();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan saat menyimpan data.');
            });
        }
    </script>
</body>
</html>
